# Allow Netlify Image CDN to optimize images served from these remote domains.
# Without this, the /.netlify/images?url=... requests for external images are blocked.
[images]
  remote_images = [
    'https://images\.bestcompany\.com/.*',
    'https://s3\.us-west-1\.amazonaws\.com/.*'
  ]

# Long, immutable cache for the self-hosted Inter fonts. Filenames are stable,
# so the browser can cache them for a year and never re-request.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
